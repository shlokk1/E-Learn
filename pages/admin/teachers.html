<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachers - EduPortal Admin</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/forms.css">
    <link rel="stylesheet" href="../../assets/css/admin-tables.css">
    <link rel="stylesheet" href="../../assets/css/admin-components.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../../assets/js/theme.js"></script>
    <script src="../../assets/js/admin-core.js"></script>
    <script src="../../assets/js/admin-layout.js"></script>
</head>
<body data-admin-page="teachers">
    <div class="app-container">
        <aside class="app-sidebar admin-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            <div class="app-content">
                <div class="mb-4" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h1>Teacher / Mentor Management</h1>
                        <p class="text-muted">Manage active teachers and verified mentors.</p>
                    </div>
                    <a href="add-teacher.html" class="btn btn-primary"><i class="ph ph-plus"></i> Add Teacher</a>
                </div>

                <div class="table-container">
                    <div class="table-header-bar">
                        <div class="form-group" style="margin: 0;">
                            <input type="text" id="teacherSearch" class="form-control" placeholder="Search teachers..." style="width: 250px;" oninput="filterTeachers()">
                        </div>
                        <div class="table-filters">
                            <select id="subjectFilter" class="form-control" onchange="filterTeachers()">
                                <option value="">All Subjects</option>
                                <option value="Mathematics">Mathematics</option>
                                <option value="Science">Science</option>
                                <option value="English">English</option>
                                <option value="Social Science">Social Science</option>
                                <option value="Hindi">Hindi</option>
                            </select>
                        </div>
                    </div>
                    
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Subjects</th>
                                <th>Classes</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="teachersTableBody">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const DEFAULT_TEACHERS = [
            { id: '1', name: 'Mr. Amit Kumar', email: 'amit@example.com', subject: 'Mathematics', classes: '9, 10', status: 'Verified', phone: '+91 98765 11111', joinedDate: 'Jan 10, 2026' },
            { id: '2', name: 'Mrs. Sunita Rao', email: 'sunita@example.com', subject: 'Science', classes: '10', status: 'Verified', phone: '+91 98765 22222', joinedDate: 'Feb 15, 2026' },
            { id: '3', name: 'Mr. Rajesh Sharma', email: 'rajesh.s@example.com', subject: 'English', classes: '9, 10', status: 'Verified', phone: '+91 98765 33333', joinedDate: 'Mar 1, 2026' }
        ];

        function getStoredTeachers() {
            const saved = localStorage.getItem('adminRegisteredTeachers');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                } catch(e) {}
            }
            localStorage.setItem('adminRegisteredTeachers', JSON.stringify(DEFAULT_TEACHERS));
            return DEFAULT_TEACHERS;
        }

        function filterTeachers() {
            const query = (document.getElementById('teacherSearch').value || '').toLowerCase().trim();
            const subjectVal = document.getElementById('subjectFilter').value;

            const all = getStoredTeachers();
            const filtered = all.filter(t => {
                const matchesQuery = !query || 
                    t.name.toLowerCase().includes(query) || 
                    (t.email && t.email.toLowerCase().includes(query)) ||
                    (t.subject && t.subject.toLowerCase().includes(query));
                const matchesSubject = !subjectVal || t.subject === subjectVal;
                return matchesQuery && matchesSubject;
            });

            renderTeachersTable(filtered);
        }

        function deleteTeacher(id, name) {
            if (!confirm(`Are you sure you want to remove ${name}?`)) return;
            let list = getStoredTeachers();
            list = list.filter(t => String(t.id) !== String(id));
            localStorage.setItem('adminRegisteredTeachers', JSON.stringify(list));
            AdminCore.showToast(`Removed teacher ${name}`, 'info');
            filterTeachers();
        }

        function renderTeachersTable(teachers) {
            const tbody = document.getElementById('teachersTableBody');
            if (!teachers || teachers.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 2.5rem; color: var(--text-muted);">
                            <i class="ph ph-chalkboard-teacher" style="font-size: 2rem; display: block; margin-bottom: 0.5rem;"></i>
                            No teachers found matching your criteria.<br>
                            <a href="add-teacher.html" class="btn btn-secondary mt-2" style="font-size:0.85rem;"><i class="ph ph-plus"></i> Add New Teacher</a>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = teachers.map(t => {
                let badgeClass = 'badge-success';
                if (t.status === 'Pending') badgeClass = 'badge-warning';
                else if (t.status === 'Inactive') badgeClass = 'badge-danger';

                return `
                    <tr>
                        <td>
                            <strong>${t.name}</strong><br>
                            <span class="text-muted" style="font-size:0.85rem">${t.email || 'No email provided'}</span>
                        </td>
                        <td>${t.subject}</td>
                        <td>${t.classes}</td>
                        <td><span class="badge ${badgeClass}">${t.status}</span></td>
                        <td>
                            <div class="table-actions">
                                <a href="teacher-details.html?id=${encodeURIComponent(t.id)}" class="btn-icon" title="View Profile"><i class="ph ph-eye"></i></a>
                                <a href="add-teacher.html?edit=${encodeURIComponent(t.id)}" class="btn-icon" title="Edit Teacher"><i class="ph ph-pencil-simple"></i></a>
                                <button class="btn-icon" onclick="deleteTeacher('${t.id}', '${t.name.replace(/'/g, "\\'")}')" title="Delete" style="color: var(--status-danger);"><i class="ph ph-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            filterTeachers();
        });
    </script>
</body>
</html>

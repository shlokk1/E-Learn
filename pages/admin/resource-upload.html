<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resource - EduPortal</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/forms.css">
    <link rel="stylesheet" href="../../assets/css/admin-components.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../../assets/js/theme.js"></script>
    <script src="../../assets/js/admin-core.js"></script>
    <script src="../../assets/js/admin-layout.js"></script>
</head>
<body data-admin-page="library">
    <div class="app-container">
        <aside class="app-sidebar admin-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            <div class="app-content">
                <a href="library.html" class="btn btn-secondary mb-4" style="padding: 0.3rem 0.6rem; font-size: 0.85rem;"><i class="ph ph-arrow-left"></i> Back to Library</a>
                
                <h1 class="mb-4" id="pageHeading">Upload Educational Resource</h1>
                
                <div class="card" style="max-width: 800px;">
                    <div class="card-body">
                        <form id="resourceForm" onsubmit="handleResourceSubmit(event)">
                            <div class="form-group">
                                <label class="form-label" for="resourceTitle">Resource Title <span style="color: var(--status-danger)">*</span></label>
                                <input type="text" id="resourceTitle" class="form-control" placeholder="e.g. Mathematics NCERT Chapter 1" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="resourceDesc">Description</label>
                                <textarea id="resourceDesc" class="form-control" style="min-height: 100px;" placeholder="Brief summary of the study material or textbook..."></textarea>
                            </div>
                            
                            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;" class="mb-3">
                                <div class="form-group">
                                    <label class="form-label" for="resourceClass">Class <span style="color: var(--status-danger)">*</span></label>
                                    <select id="resourceClass" class="form-control" required>
                                        <option value="10" selected>Class 10</option>
                                        <option value="9">Class 9</option>
                                        <option value="8">Class 8</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="resourceSubject">Subject <span style="color: var(--status-danger)">*</span></label>
                                    <select id="resourceSubject" class="form-control" required>
                                        <option value="Mathematics" selected>Mathematics</option>
                                        <option value="Science">Science</option>
                                        <option value="English">English</option>
                                        <option value="Social Science">Social Science</option>
                                        <option value="Hindi">Hindi</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="resourceType">Type <span style="color: var(--status-danger)">*</span></label>
                                    <select id="resourceType" class="form-control" required>
                                        <option value="Textbook" selected>Textbook</option>
                                        <option value="PPT">PPT</option>
                                        <option value="Notes">Notes</option>
                                        <option value="Worksheet">Worksheet</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="resourceFile">File Upload (PDF, PPTX, etc.)</label>
                                <div style="border: 2px dashed var(--border-color); padding: 1.75rem; text-align: center; border-radius: var(--border-radius); background: var(--bg-color);">
                                    <i class="ph ph-upload-simple" style="font-size: 2rem; color: var(--text-muted); margin-bottom: 0.5rem;"></i>
                                    <p class="text-muted" id="fileUploadPrompt" style="margin-bottom: 0.75rem; font-size: 0.9rem;">Drag and drop file here, or click to browse.</p>
                                    <input type="file" id="resourceFile">
                                </div>
                            </div>
                            
                            <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                                <a href="library.html" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary" id="submitBtn"><i class="ph ph-upload-simple"></i> Upload & Publish</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let editResourceId = null;

        const DEFAULT_RESOURCES = [
            { id: 'res_1', title: 'Mathematics NCERT', type: 'Textbook', class: '10', subject: 'Mathematics', desc: 'Official NCERT Textbook for Class 10 Math', fileName: 'mathematics_ncert.pdf', status: 'Active' },
            { id: 'res_2', title: 'Chemical Reactions', type: 'PPT', class: '10', subject: 'Science', desc: 'Presentation slides on chemical equations and reactions', fileName: 'chemical_reactions.pptx', status: 'Active' },
            { id: 'res_3', title: 'World History Overview', type: 'Textbook', class: '9', subject: 'Social Science', desc: 'Comprehensive world history textbook for Class 9', fileName: 'world_history.pdf', status: 'Active' },
            { id: 'res_4', title: 'Physics Formula Sheet', type: 'Notes', class: '10', subject: 'Science', desc: 'Quick reference formulas for Board Exams', fileName: 'physics_formulas.pdf', status: 'Active' },
            { id: 'res_5', title: 'English Grammar Workbook', type: 'Worksheet', class: '9', subject: 'English', desc: 'Grammar exercises and sample letters', fileName: 'english_grammar.pdf', status: 'Active' }
        ];

        function getStoredResources() {
            const saved = localStorage.getItem('adminLibraryResources');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                } catch(e) {}
            }
            localStorage.setItem('adminLibraryResources', JSON.stringify(DEFAULT_RESOURCES));
            return DEFAULT_RESOURCES;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const editId = params.get('edit') || params.get('id');

            if (editId) {
                editResourceId = editId;
                const resources = getStoredResources();
                const res = resources.find(r => String(r.id) === String(editId));

                if (res) {
                    document.title = 'Edit Resource - EduPortal';
                    document.getElementById('pageHeading').textContent = 'Edit Educational Resource';
                    document.getElementById('resourceTitle').value = res.title || '';
                    document.getElementById('resourceDesc').value = res.desc || '';
                    if (res.class) document.getElementById('resourceClass').value = res.class;
                    if (res.subject) document.getElementById('resourceSubject').value = res.subject;
                    if (res.type) document.getElementById('resourceType').value = res.type;

                    if (res.fileName) {
                        document.getElementById('fileUploadPrompt').innerHTML = `Current attached file: <strong>${res.fileName}</strong><br><span style="font-size:0.8rem; color:var(--text-muted);">Select a new file below to replace it (optional)</span>`;
                    }

                    document.getElementById('submitBtn').innerHTML = '<i class="ph ph-check"></i> Save Changes';
                }
            } else {
                const targetClass = params.get('class');
                if (targetClass) {
                    const select = document.getElementById('resourceClass');
                    let exists = Array.from(select.options).some(o => o.value === targetClass);
                    if (!exists) {
                        const opt = document.createElement('option');
                        opt.value = targetClass;
                        opt.textContent = `Class ${targetClass}`;
                        select.appendChild(opt);
                    }
                    select.value = targetClass;
                }
                // If new upload, file is required
                document.getElementById('resourceFile').setAttribute('required', 'true');
            }
        });

        function handleResourceSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('resourceTitle').value.trim();
            const desc = document.getElementById('resourceDesc').value.trim();
            const cls = document.getElementById('resourceClass').value;
            const subject = document.getElementById('resourceSubject').value;
            const type = document.getElementById('resourceType').value;
            const fileInput = document.getElementById('resourceFile');

            const resources = getStoredResources();

            if (editResourceId) {
                const index = resources.findIndex(r => String(r.id) === String(editResourceId));
                if (index > -1) {
                    const existing = resources[index];
                    const fileName = (fileInput.files && fileInput.files[0]) ? fileInput.files[0].name : (existing.fileName || 'document.pdf');
                    resources[index] = {
                        ...existing,
                        title,
                        desc,
                        class: cls,
                        subject,
                        type,
                        fileName
                    };
                }
                localStorage.setItem('adminLibraryResources', JSON.stringify(resources));
                AdminCore.showToast(`Updated resource "${title}"!`, 'success');
            } else {
                const fileName = (fileInput.files && fileInput.files[0]) ? fileInput.files[0].name : 'document.pdf';
                const newResource = {
                    id: 'res_' + Date.now(),
                    title,
                    desc,
                    class: cls,
                    subject,
                    type,
                    fileName,
                    status: 'Active'
                };
                resources.unshift(newResource);
                localStorage.setItem('adminLibraryResources', JSON.stringify(resources));
                AdminCore.showToast(`Resource "${title}" uploaded successfully!`, 'success');
            }

            setTimeout(() => {
                window.location.href = 'library.html';
            }, 1000);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements - EduPortal Admin</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/forms.css">
    <link rel="stylesheet" href="../../assets/css/admin-tables.css">
    <link rel="stylesheet" href="../../assets/css/admin-components.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../../assets/js/theme.js"></script>
    <script src="../../assets/js/admin-core.js"></script>
    <script src="../../assets/js/admin-layout.js"></script>
    <style>
        .notice-preview {
            max-width: 380px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }
        .audience-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.65rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 500;
            background: rgba(99, 102, 241, 0.08);
            color: var(--primary-color);
        }
    </style>
</head>
<body data-admin-page="announcements">
    <div class="app-container">
        <aside class="app-sidebar admin-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            <div class="app-content">
                <div class="mb-4" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                    <div>
                        <h1>Announcements</h1>
                        <p class="text-muted">Manage global and class-specific notices.</p>
                    </div>
                    <a href="create-announcement.html" class="btn btn-primary"><i class="ph ph-plus"></i> Create Notice</a>
                </div>

                <div class="table-container">
                    <div class="table-header-bar">
                        <div class="form-group" style="margin: 0; flex: 1; max-width: 320px;">
                            <input type="text" id="announcementSearch" class="form-control" placeholder="Search notices by title or content..." oninput="renderAnnouncements()">
                        </div>
                        <div class="table-filters">
                            <select id="audienceFilter" class="form-control" onchange="renderAnnouncements()">
                                <option value="">All Audiences</option>
                                <option value="All Students & Teachers">All Students & Teachers</option>
                                <option value="Class 10 Only">Class 10 Only</option>
                                <option value="Class 9 Only">Class 9 Only</option>
                                <option value="Teachers Only">Teachers Only</option>
                            </select>
                            <select id="statusFilter" class="form-control" onchange="renderAnnouncements()">
                                <option value="">All Statuses</option>
                                <option value="Published">Published</option>
                                <option value="Draft">Draft</option>
                            </select>
                            <button class="btn btn-secondary" onclick="resetFilters()"><i class="ph ph-arrow-counter-clockwise"></i> Reset</button>
                        </div>
                    </div>

                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Title & Content</th>
                                <th>Audience</th>
                                <th>Date Published</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="announcementsTableBody">
                            <!-- Populated dynamically via JS -->
                        </tbody>
                    </table>

                    <div id="empty-state-notice" style="display: none; padding: 3rem 1.5rem; text-align: center;">
                        <i class="ph ph-megaphone" style="font-size: 3rem; color: var(--text-muted); opacity: 0.6; margin-bottom: 0.75rem; display: inline-block;"></i>
                        <h4 style="margin-bottom: 0.25rem;">No Announcements Found</h4>
                        <p class="text-muted" style="margin-bottom: 1rem;">No notices match your current search or filters.</p>
                        <button class="btn btn-secondary" onclick="resetFilters()">Clear Filters</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-notice-modal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div class="modal-content card" style="width:100%; max-width:420px; padding:2rem; position:relative;">
            <button onclick="closeDeleteModal()" style="position:absolute; top:1rem; right:1rem; background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--text-main);"><i class="ph ph-x"></i></button>
            <h3 style="margin-bottom: 0.75rem; color: var(--status-danger); display: flex; align-items: center; gap: 0.5rem;">
                <i class="ph ph-trash"></i> Delete Announcement
            </h3>
            <p id="delete-modal-msg" style="margin-bottom: 1.5rem; line-height: 1.5; color: var(--text-muted);">Are you sure you want to delete this notice? This action cannot be undone.</p>
            <div style="display: flex; gap: 0.75rem; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger" onclick="confirmDelete()"><i class="ph ph-trash"></i> Delete Notice</button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_ANNOUNCEMENTS = [
            {
                id: 'ann_1',
                title: 'Math Unit Test Schedule',
                content: 'The upcoming unit test for Class 10 Mathematics has been scheduled for next Monday. The syllabus includes Chapter 1 to 3. Please refer to the digital library for practice papers.',
                audience: 'Class 10 Only',
                date: 'Aug 18, 2026',
                status: 'Published'
            },
            {
                id: 'ann_2',
                title: 'Holiday Notice - Diwali',
                content: 'The school will remain closed from Oct 24 to Oct 28 for Diwali break. Wishing everyone a happy and safe festival of lights!',
                audience: 'All Students & Teachers',
                date: 'Aug 15, 2026',
                status: 'Published'
            }
        ];

        let noticeToDelete = null;

        function getAnnouncements() {
            const stored = localStorage.getItem('mockAnnouncements');
            if (stored) {
                try { return JSON.parse(stored); } catch (e) {}
            }
            localStorage.setItem('mockAnnouncements', JSON.stringify(DEFAULT_ANNOUNCEMENTS));
            return DEFAULT_ANNOUNCEMENTS;
        }

        function saveAnnouncements(list) {
            localStorage.setItem('mockAnnouncements', JSON.stringify(list));
        }

        function renderAnnouncements() {
            const list = getAnnouncements();
            const search = (document.getElementById('announcementSearch')?.value || '').trim().toLowerCase();
            const audience = document.getElementById('audienceFilter')?.value || '';
            const status = document.getElementById('statusFilter')?.value || '';

            const filtered = list.filter(item => {
                if (audience && item.audience !== audience) return false;
                if (status && item.status !== status) return false;
                if (search) {
                    const matchTitle = (item.title || '').toLowerCase().includes(search);
                    const matchContent = (item.content || '').toLowerCase().includes(search);
                    if (!matchTitle && !matchContent) return false;
                }
                return true;
            });

            const tbody = document.getElementById('announcementsTableBody');
            const emptyState = document.getElementById('empty-state-notice');
            if (!tbody) return;
            tbody.innerHTML = '';

            if (filtered.length === 0) {
                if (emptyState) emptyState.style.display = 'block';
                return;
            } else {
                if (emptyState) emptyState.style.display = 'none';
            }

            filtered.forEach(item => {
                const statusBadge = item.status === 'Draft' 
                    ? '<span class="badge badge-secondary">Draft</span>' 
                    : '<span class="badge badge-success">Published</span>';

                tbody.innerHTML += `
                    <tr>
                        <td>
                            <strong style="color: var(--text-main); font-size: 0.95rem;">${item.title}</strong>
                            <div class="notice-preview">${item.content}</div>
                        </td>
                        <td>
                            <span class="audience-pill"><i class="ph ph-users"></i> ${item.audience}</span>
                        </td>
                        <td>${item.date}</td>
                        <td>${statusBadge}</td>
                        <td>
                            <div class="table-actions">
                                <a href="create-announcement.html?edit=${item.id}" class="btn-icon" title="Edit Notice" style="display: inline-flex; align-items: center; justify-content: center; text-decoration: none;">
                                    <i class="ph ph-pencil-simple"></i>
                                </a>
                                <button class="btn-icon" style="color:var(--status-danger)" title="Delete Notice" onclick="promptDelete('${item.id}')">
                                    <i class="ph ph-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function resetFilters() {
            const search = document.getElementById('announcementSearch');
            const aud = document.getElementById('audienceFilter');
            const st = document.getElementById('statusFilter');
            if (search) search.value = '';
            if (aud) aud.value = '';
            if (st) st.value = '';
            renderAnnouncements();
        }

        function promptDelete(id) {
            const list = getAnnouncements();
            noticeToDelete = list.find(a => a.id === id);
            if (!noticeToDelete) return;

            const msgEl = document.getElementById('delete-modal-msg');
            if (msgEl) {
                msgEl.textContent = `Are you sure you want to delete "${noticeToDelete.title}"? This notice will be removed for all targeted students and teachers.`;
            }
            document.getElementById('delete-notice-modal').style.display = 'flex';
        }

        function closeDeleteModal() {
            document.getElementById('delete-notice-modal').style.display = 'none';
            noticeToDelete = null;
        }

        function confirmDelete() {
            if (!noticeToDelete) return;
            let list = getAnnouncements();
            list = list.filter(a => a.id !== noticeToDelete.id);
            saveAnnouncements(list);
            closeDeleteModal();
            AdminCore.showToast('Announcement deleted successfully!', 'info');
            renderAnnouncements();
        }

        document.addEventListener('DOMContentLoaded', renderAnnouncements);
    </script>
</body>
</html>

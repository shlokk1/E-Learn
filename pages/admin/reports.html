<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - EduPortal Admin</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/forms.css">
    <link rel="stylesheet" href="../../assets/css/admin-components.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../../assets/js/theme.js"></script>
    <script src="../../assets/js/admin-core.js"></script>
    <script src="../../assets/js/admin-layout.js"></script>
</head>
<body data-admin-page="reports">
    <div class="app-container">
        <aside class="app-sidebar admin-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            <div class="app-content">
                <div class="mb-4" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h1>Platform Reports</h1>
                        <p class="text-muted">Basic analytics and platform usage metrics.</p>
                    </div>
                    <select class="form-control" style="width: auto;"><option>Last 7 Days</option><option>Last 30 Days</option><option>All Time</option></select>
                </div>

                <div class="grid-dashboard">
                    <div>
                        <div class="card mb-4">
                            <div class="card-header"><h3 class="card-title">Doubt Resolution Status</h3></div>
                            <div class="card-body">
                                <!-- Simple HTML bars mimicking chart -->
                                <div class="mb-3">
                                    <div style="display:flex; justify-content:space-between; margin-bottom:0.25rem;"><span>Resolved</span> <span>85%</span></div>
                                    <div style="height:8px; background:var(--bg-color); border-radius:4px; overflow:hidden;">
                                        <div style="height:100%; width:85%; background:var(--status-success);"></div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <div style="display:flex; justify-content:space-between; margin-bottom:0.25rem;"><span>In Progress</span> <span>10%</span></div>
                                    <div style="height:8px; background:var(--bg-color); border-radius:4px; overflow:hidden;">
                                        <div style="height:100%; width:10%; background:var(--status-warning);"></div>
                                    </div>
                                </div>
                                <div>
                                    <div style="display:flex; justify-content:space-between; margin-bottom:0.25rem;"><span>Rejected</span> <span>5%</span></div>
                                    <div style="height:8px; background:var(--bg-color); border-radius:4px; overflow:hidden;">
                                        <div style="height:100%; width:5%; background:var(--status-danger);"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <div class="card mb-4">
                            <div class="card-header"><h3 class="card-title">Quick Stats</h3></div>
                            <div class="card-body" style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                                <div style="padding:1rem; border:1px solid var(--border-color); border-radius:var(--border-radius); text-align:center;">
                                    <div style="font-size:1.5rem; font-weight:bold; color:var(--primary-color);">450</div>
                                    <div class="text-muted" style="font-size:0.85rem;">Doubts Submitted</div>
                                </div>
                                <div style="padding:1rem; border:1px solid var(--border-color); border-radius:var(--border-radius); text-align:center;">
                                    <div style="font-size:1.5rem; font-weight:bold; color:var(--primary-color);">12</div>
                                    <div class="text-muted" style="font-size:0.85rem;">Warnings Issued</div>
                                </div>
                                <div style="padding:1rem; border:1px solid var(--border-color); border-radius:var(--border-radius); text-align:center;">
                                    <div style="font-size:1.5rem; font-weight:bold; color:var(--primary-color);">85</div>
                                    <div class="text-muted" style="font-size:0.85rem;">Resources Added</div>
                                </div>
                                <div style="padding:1rem; border:1px solid var(--border-color); border-radius:var(--border-radius); text-align:center;">
                                    <div style="font-size:1.5rem; font-weight:bold; color:var(--primary-color);">1.2k</div>
                                    <div class="text-muted" style="font-size:0.85rem;">Active Students</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Reset Student Password - EduPortal Admin</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/forms.css">
    <link rel="stylesheet" href="../../assets/css/admin-components.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../../assets/js/theme.js"></script>
    <script src="../../assets/js/mock-data.js"></script>
    <script src="../../assets/js/admin-core.js"></script>
    <script src="../../assets/js/admin-layout.js"></script>
    <style>
        .student-profile-strip {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
        }
        .student-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary-color);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 600;
            flex-shrink: 0;
        }
        .password-field-wrap {
            position: relative;
        }
        .password-toggle-btn {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .password-toggle-btn:hover {
            color: var(--text-main);
        }
        .password-strength-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.35rem;
        }
        .credential-option {
            display: flex;
            align-items: flex-start;
            gap: 0.65rem;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
            color: var(--text-main);
            cursor: pointer;
        }
        .credential-option input[type="checkbox"] {
            margin-top: 0.2rem;
            cursor: pointer;
        }
    </style>
</head>
<body data-admin-page="students">
    <div class="app-container">
        <aside class="app-sidebar admin-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            <div class="app-content">
                <a href="students.html" class="btn btn-secondary mb-4" id="backLink" style="padding: 0.3rem 0.6rem; font-size: 0.85rem;">
                    <i class="ph ph-arrow-left"></i> Back to Student Profile
                </a>

                <div class="mb-4">
                    <h1 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 0.25rem;" id="pageHeading">Reset Student Password</h1>
                    <p class="text-muted" style="margin: 0;">Issue a new secure password or temporary login credentials for the student account.</p>
                </div>

                <div class="card" style="max-width: 650px;">
                    <div class="card-body">
                        <!-- Student Profile Summary -->
                        <div class="student-profile-strip">
                            <div class="student-avatar" id="studentAvatar">R</div>
                            <div>
                                <div style="font-weight: 600; font-size: 1.05rem; color: var(--text-main);" id="studentName">Rahul Sharma</div>
                                <div style="font-size: 0.85rem; color: var(--text-muted);" id="studentDetails">Class 10 - Div A &bull; rahul@example.com</div>
                            </div>
                        </div>

                        <!-- Reset Password Form -->
                        <form id="resetPasswordForm" onsubmit="handleResetPassword(event)">
                            <div class="form-group mb-3">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
                                    <label class="form-label" for="newPassword" style="margin: 0;">New Password <span style="color: var(--status-danger)">*</span></label>
                                    <button type="button" class="btn btn-secondary" onclick="generateRandomPassword()" style="font-size: 0.8rem; padding: 0.2rem 0.6rem;">
                                        <i class="ph ph-sparkle"></i> Generate Password
                                    </button>
                                </div>
                                <div class="password-field-wrap">
                                    <input type="password" id="newPassword" class="form-control" placeholder="Enter new password (min. 6 characters)" required minlength="6" oninput="validatePasswords()">
                                    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('newPassword', this)" title="Show/Hide Password">
                                        <i class="ph ph-eye"></i>
                                    </button>
                                </div>
                                <div class="password-strength-hint">Must contain at least 6 characters with letters and numbers.</div>
                            </div>

                            <div class="form-group mb-4">
                                <label class="form-label" for="confirmPassword">Confirm New Password <span style="color: var(--status-danger)">*</span></label>
                                <div class="password-field-wrap">
                                    <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter new password" required minlength="6" oninput="validatePasswords()">
                                    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('confirmPassword', this)" title="Show/Hide Password">
                                        <i class="ph ph-eye"></i>
                                    </button>
                                </div>
                                <div id="passwordMismatchMsg" style="display: none; color: var(--status-danger); font-size: 0.8rem; margin-top: 0.35rem;">
                                    Passwords do not match.
                                </div>
                            </div>

                            <div style="background: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--border-radius); padding: 1rem; margin-bottom: 1.5rem;">
                                <label class="credential-option">
                                    <input type="checkbox" id="requireChangeCheckbox" checked>
                                    <span>Require student to change password on next sign-in</span>
                                </label>
                                <label class="credential-option">
                                    <input type="checkbox" id="notifyEmailCheckbox" checked>
                                    <span>Send reset confirmation & temporary credentials to student's email</span>
                                </label>
                                <label class="credential-option" style="margin-bottom: 0;">
                                    <input type="checkbox" id="logoutOtherDevicesCheckbox" checked>
                                    <span>Revoke active login sessions on all other devices</span>
                                </label>
                            </div>

                            <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                                <a href="students.html" class="btn btn-secondary" id="cancelLink">Cancel</a>
                                <button type="submit" class="btn btn-primary" id="savePasswordBtn">
                                    <i class="ph ph-lock-key"></i> Update & Reset Password
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('id') || urlParams.get('studentId') || '1';
        let currentStudent = null;

        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('adminRegisteredStudents');
            let students = [
                { id: '1', name: 'Rahul Sharma', email: 'rahul@example.com', class: '10', division: 'A', status: 'Active' },
                { id: '2', name: 'Priya Singh', email: 'priya@example.com', class: '10', division: 'A', status: 'Active' },
                { id: '3', name: 'Amit Verma', email: 'amit.v@example.com', class: '10', division: 'B', status: 'Active' },
                { id: '4', name: 'Sneha Kulkarni', email: 'sneha.k@example.com', class: '9', division: 'A', status: 'Inactive' }
            ];

            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) students = parsed;
                } catch(e) {}
            }

            currentStudent = students.find(s => String(s.id) === String(studentId)) || students[0];

            if (currentStudent) {
                document.getElementById('pageTitle').textContent = `Reset Password: ${currentStudent.name} - EduPortal Admin`;
                document.getElementById('pageHeading').textContent = `Reset Password: ${currentStudent.name}`;
                document.getElementById('studentAvatar').textContent = (currentStudent.name[0] || 'S').toUpperCase();
                document.getElementById('studentName').textContent = currentStudent.name;
                document.getElementById('studentDetails').textContent = `Class ${currentStudent.class} - Div ${currentStudent.division} &bull; ${currentStudent.email || 'No email'}`;

                const backLink = document.getElementById('backLink');
                const cancelLink = document.getElementById('cancelLink');
                const returnUrl = `student-details.html?id=${encodeURIComponent(currentStudent.id)}`;
                if (backLink) backLink.href = returnUrl;
                if (cancelLink) cancelLink.href = returnUrl;
            }
        });

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            btn.innerHTML = isPassword ? '<i class="ph ph-eye-slash"></i>' : '<i class="ph ph-eye"></i>';
        }

        function generateRandomPassword() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%';
            let password = 'Ed@';
            for (let i = 0; i < 7; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            const newPassInput = document.getElementById('newPassword');
            const confirmPassInput = document.getElementById('confirmPassword');
            newPassInput.value = password;
            confirmPassInput.value = password;
            newPassInput.type = 'text';
            confirmPassInput.type = 'text';

            document.querySelectorAll('.password-toggle-btn').forEach(btn => {
                btn.innerHTML = '<i class="ph ph-eye-slash"></i>';
            });
            validatePasswords();
            AdminCore.showToast('Generated strong password!', 'info');
        }

        function validatePasswords() {
            const p1 = document.getElementById('newPassword').value;
            const p2 = document.getElementById('confirmPassword').value;
            const msg = document.getElementById('passwordMismatchMsg');
            const saveBtn = document.getElementById('savePasswordBtn');

            if (p2.length > 0 && p1 !== p2) {
                msg.style.display = 'block';
                saveBtn.disabled = true;
                return false;
            } else {
                msg.style.display = 'none';
                saveBtn.disabled = false;
                return true;
            }
        }

        function handleResetPassword(e) {
            e.preventDefault();
            const p1 = document.getElementById('newPassword').value;
            const p2 = document.getElementById('confirmPassword').value;

            if (p1 !== p2) {
                AdminCore.showToast('Passwords do not match.', 'error');
                return;
            }

            if (p1.length < 6) {
                AdminCore.showToast('Password must be at least 6 characters long.', 'warning');
                return;
            }

            // Save reset state in localStorage
            if (currentStudent) {
                const saved = localStorage.getItem('adminRegisteredStudents');
                if (saved) {
                    try {
                        const students = JSON.parse(saved);
                        const idx = students.findIndex(s => String(s.id) === String(currentStudent.id));
                        if (idx > -1) {
                            students[idx].passwordLastReset = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                            students[idx].requirePasswordChange = document.getElementById('requireChangeCheckbox').checked;
                            localStorage.setItem('adminRegisteredStudents', JSON.stringify(students));
                        }
                    } catch(e) {}
                }

                if (typeof MOCK_DATA !== 'undefined' && MOCK_DATA.addNotification) {
                    MOCK_DATA.addNotification(`Password Reset: Credentials for student ${currentStudent.name} (${currentStudent.email}) were updated by Admin.`, 'STUDENT');
                }
            }

            AdminCore.showToast(`Password for ${currentStudent ? currentStudent.name : 'student'} has been successfully updated!`, 'success');

            setTimeout(() => {
                const returnUrl = currentStudent ? `student-details.html?id=${encodeURIComponent(currentStudent.id)}` : 'students.html';
                window.location.href = returnUrl;
            }, 1200);
        }
    </script>
</body>
</html>

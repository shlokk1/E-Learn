<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Details - EduPortal Admin</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/admin-components.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../../assets/js/theme.js"></script>
    <script src="../../assets/js/admin-core.js"></script>
    <script src="../../assets/js/admin-layout.js"></script>
</head>
<body data-admin-page="teachers">
    <div class="app-container">
        <aside class="app-sidebar admin-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            <div class="app-content">
                <a href="teachers.html" class="btn btn-secondary mb-4" style="padding: 0.3rem 0.6rem; font-size: 0.85rem;"><i class="ph ph-arrow-left"></i> Back to Teachers</a>
                
                <div class="grid-dashboard">
                    <div>
                        <div class="card mb-4">
                            <div class="card-body" style="display: flex; gap: 2rem; align-items: center;">
                                <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--status-info); color: white; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 600;">A</div>
                                <div>
                                    <h1 style="margin-bottom: 0.25rem;">Mr. Amit Kumar</h1>
                                    <p class="text-muted mb-2">amit@example.com</p>
                                    <span class="badge badge-success">Verified Mentor</span>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header"><h3 class="card-title">Contribution Statistics</h3></div>
                            <div class="card-body" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                                <div style="text-align: center; padding: 1rem; border: 1px solid var(--border-color); border-radius: var(--border-radius);">
                                    <div style="font-size: 1.5rem; font-weight: bold; color: var(--primary-color);">148</div>
                                    <div class="text-muted" style="font-size: 0.85rem;">Doubts Answered</div>
                                </div>
                                <div style="text-align: center; padding: 1rem; border: 1px solid var(--border-color); border-radius: var(--border-radius);">
                                    <div style="font-size: 1.5rem; font-weight: bold; color: var(--primary-color);">42</div>
                                    <div class="text-muted" style="font-size: 0.85rem;">Community Moderations</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <div class="card mb-4">
                            <div class="card-header"><h3 class="card-title">Academic Assignment</h3></div>
                            <div class="card-body">
                                <p><strong>Subjects:</strong> Mathematics</p>
                                <p><strong>Classes Assigned:</strong> 9, 10</p>
                                <p><strong>Joined Date:</strong> Jan 10, 2026</p>
                            </div>
                        </div>
                        
                        <div class="card">
                            <div class="card-header"><h3 class="card-title">Actions</h3></div>
                            <div class="card-body" style="display: flex; flex-direction: column; gap: 0.75rem;">
                                <a href="add-teacher.html?edit=1" id="editTeacherBtn" class="btn btn-secondary"><i class="ph ph-pencil-simple"></i> Edit Teacher</a>
                                <button class="btn btn-danger">Deactivate Account</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const teacherId = params.get('id');
            if (!teacherId) return;

            const saved = localStorage.getItem('adminRegisteredTeachers');
            let teacher = null;
            if (saved) {
                try {
                    const list = JSON.parse(saved);
                    teacher = list.find(t => String(t.id) === String(teacherId));
                } catch(e) {}
            }

            if (teacher) {
                document.title = `${teacher.name} - Teacher Details - EduPortal Admin`;

                // Avatar
                const avatar = document.querySelector('.card-body div[style*="border-radius: 50%"]');
                if (avatar) avatar.textContent = (teacher.name.replace(/^(Mr\.|Mrs\.|Ms\.|Dr\.)\s*/, '')[0] || 'T').toUpperCase();

                // Name & Email
                const nameEl = document.querySelector('.card-body h1');
                if (nameEl) nameEl.textContent = teacher.name;

                const emailEl = document.querySelector('.card-body p.text-muted');
                if (emailEl) emailEl.textContent = teacher.email || 'No email provided';

                // Status
                const statusBadge = document.querySelector('.card-body .badge');
                if (statusBadge) {
                    statusBadge.textContent = teacher.status === 'Verified' ? 'Verified Educator' : teacher.status;
                    statusBadge.className = 'badge ' + (teacher.status === 'Pending' ? 'badge-warning' : (teacher.status === 'Inactive' ? 'badge-danger' : 'badge-success'));
                }

                // Academic Assignment
                const academicCard = document.querySelector('.card-header h3.card-title');
                const cards = document.querySelectorAll('.card');
                cards.forEach(c => {
                    const h3 = c.querySelector('.card-header h3');
                    if (h3 && h3.textContent.includes('Academic Assignment')) {
                        const cb = c.querySelector('.card-body');
                        if (cb) {
                            const pTags = cb.querySelectorAll('p');
                            if (pTags[0]) pTags[0].innerHTML = `<strong>Subjects:</strong> ${teacher.subject}`;
                            if (pTags[1]) pTags[1].innerHTML = `<strong>Classes Assigned:</strong> ${teacher.classes}`;
                            if (pTags[2]) pTags[2].innerHTML = `<strong>Joined Date:</strong> ${teacher.joinedDate || 'Recent'}`;
                        }
                    }
                });

                const editBtn = document.getElementById('editTeacherBtn');
                if (editBtn) editBtn.href = `add-teacher.html?edit=${encodeURIComponent(teacher.id)}`;
            }
        });
    </script>
</body>
</html>

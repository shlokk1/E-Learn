<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects - EduPortal Admin</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/forms.css">
    <link rel="stylesheet" href="../../assets/css/admin-tables.css">
    <link rel="stylesheet" href="../../assets/css/admin-components.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../../assets/js/theme.js"></script>
    <script src="../../assets/js/admin-core.js"></script>
    <script src="../../assets/js/admin-layout.js"></script>
    <style>
        .class-box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background: var(--surface-color);
        }
        .subject-item {
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .subject-item:last-child {
            border-bottom: none;
        }
        .subject-actions {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .subject-actions .btn-icon {
            padding: 0.35rem;
            font-size: 0.95rem;
        }
    </style>
</head>
<body data-admin-page="subjects">
    <div class="app-container">
        <aside class="app-sidebar admin-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            <div class="app-content">
                <div class="mb-4" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                    <div>
                        <h1>Subject Management</h1>
                        <p class="text-muted">Manage academic subjects organized by class and grade levels.</p>
                    </div>
                    <div style="display: flex; gap: 0.75rem; align-items: center;">
                        <input type="text" id="subjectSearchInput" class="form-control" placeholder="Search subjects or code..." style="width: 220px;" oninput="renderClassBoxes()">
                        <a href="add-subject.html" class="btn btn-primary"><i class="ph ph-plus"></i> Add Subject</a>
                    </div>
                </div>

                <div class="grid-cards" id="classBoxesContainer">
                    <!-- Class boxes populated dynamically -->
                </div>
            </div>
        </main>
    </div>

    <script>
        const DEFAULT_SUBJECTS = [
            { id: 'sub_1', class: '10', name: 'Mathematics', code: 'MATH-10', status: 'Active' },
            { id: 'sub_2', class: '10', name: 'Science', code: 'SCI-10', status: 'Active' },
            { id: 'sub_3', class: '10', name: 'English Literature', code: 'ENG-10', status: 'Active' },
            { id: 'sub_4', class: '10', name: 'Social Science', code: 'SOC-10', status: 'Active' },
            { id: 'sub_5', class: '10', name: 'Hindi Course A', code: 'HIN-10', status: 'Active' },
            { id: 'sub_6', class: '9', name: 'Mathematics', code: 'MATH-9', status: 'Active' },
            { id: 'sub_7', class: '9', name: 'Science', code: 'SCI-9', status: 'Active' },
            { id: 'sub_8', class: '9', name: 'English Language', code: 'ENG-9', status: 'Active' },
            { id: 'sub_9', class: '9', name: 'Social Studies', code: 'SOC-9', status: 'Active' },
            { id: 'sub_10', class: '8', name: 'General Science', code: 'SCI-8', status: 'Active' },
            { id: 'sub_11', class: '8', name: 'Basic Mathematics', code: 'MATH-8', status: 'Active' },
            { id: 'sub_12', class: '8', name: 'English Grammar', code: 'ENG-8', status: 'Active' }
        ];

        function getStoredSubjects() {
            const saved = localStorage.getItem('adminSubjectsData');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                } catch(e) {}
            }
            localStorage.setItem('adminSubjectsData', JSON.stringify(DEFAULT_SUBJECTS));
            return DEFAULT_SUBJECTS;
        }

        function saveSubjects(data) {
            localStorage.setItem('adminSubjectsData', JSON.stringify(data));
            renderClassBoxes();
        }

        function deleteSubject(subId, subName) {
            if (!confirm(`Are you sure you want to delete "${subName}"?`)) return;
            let subjects = getStoredSubjects();
            subjects = subjects.filter(s => String(s.id) !== String(subId));
            saveSubjects(subjects);
            AdminCore.showToast(`Deleted subject "${subName}"`, 'info');
        }

        function renderClassBoxes() {
            const subjects = getStoredSubjects();
            const search = (document.getElementById('subjectSearchInput').value || '').trim().toLowerCase();
            const container = document.getElementById('classBoxesContainer');

            // Unique class list in descending order (e.g., 10, 9, 8...)
            const classSet = new Set(subjects.map(s => s.class));
            // Always ensure classes 10, 9, 8 are represented
            classSet.add('10');
            classSet.add('9');
            classSet.add('8');

            const classList = Array.from(classSet).sort((a, b) => parseInt(b) - parseInt(a));

            container.innerHTML = classList.map(cls => {
                let classSubjects = subjects.filter(s => String(s.class) === String(cls));
                if (search) {
                    classSubjects = classSubjects.filter(s => 
                        s.name.toLowerCase().includes(search) || 
                        s.code.toLowerCase().includes(search)
                    );
                }

                const count = classSubjects.length;

                const subjectsHtml = classSubjects.length > 0
                    ? classSubjects.map(sub => `
                        <li class="subject-item">
                            <div>
                                <div style="font-weight: 500; font-size: 0.95rem;">${sub.name}</div>
                                <div style="display: flex; gap: 0.5rem; align-items: center; margin-top: 0.2rem;">
                                    <span class="badge badge-info" style="font-size: 0.65rem; padding: 0.15rem 0.4rem;">${sub.code}</span>
                                    <span class="badge ${sub.status === 'Active' ? 'badge-success' : 'badge-danger'}" style="font-size: 0.65rem; padding: 0.15rem 0.4rem;">${sub.status}</span>
                                </div>
                            </div>
                            <div class="subject-actions">
                                <a href="add-subject.html?edit=${encodeURIComponent(sub.id)}&class=${encodeURIComponent(cls)}" class="btn-icon" title="Edit Subject">
                                    <i class="ph ph-pencil-simple"></i>
                                </a>
                                <button class="btn-icon" onclick="deleteSubject('${sub.id}', '${sub.name.replace(/'/g, "\\'")}')" title="Delete Subject" style="color: var(--status-danger);">
                                    <i class="ph ph-trash"></i>
                                </button>
                            </div>
                        </li>
                    `).join('')
                    : `<li style="padding: 1.5rem 0; text-align: center; color: var(--text-muted); font-size: 0.85rem;">
                        ${search ? 'No subjects matched your search.' : 'No subjects in this class yet.'}
                       </li>`;

                return `
                    <div class="card">
                        <div class="class-box-header">
                            <div>
                                <h3 class="card-title" style="margin: 0; font-size: 1.15rem;">Class ${cls}</h3>
                                <span class="badge badge-info" style="font-size: 0.7rem; margin-top: 0.25rem;">${count} Subject${count === 1 ? '' : 's'}</span>
                            </div>
                            <a href="add-subject.html?class=${encodeURIComponent(cls)}" class="btn btn-secondary" style="font-size: 0.8rem; padding: 0.35rem 0.75rem;">
                                <i class="ph ph-plus"></i> Add
                            </a>
                        </div>
                        <div class="card-body">
                            <ul style="list-style: none; padding: 0; margin-bottom: 1.25rem;">
                                ${subjectsHtml}
                            </ul>
                            <a href="add-subject.html?class=${encodeURIComponent(cls)}" class="btn btn-secondary w-100" style="width: 100%; justify-content: center; font-size: 0.85rem;">
                                <i class="ph ph-plus-circle"></i> Add Subject to Class ${cls}
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderClassBoxes();
        });
    </script>
</body>
</html>

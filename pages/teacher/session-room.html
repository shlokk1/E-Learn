<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conduct Session - Teacher Portal</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/forms.css">
    <link rel="stylesheet" href="../../assets/css/sessions.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../../assets/js/theme.js"></script>
    <script src="../../assets/js/mock-data.js"></script>
    <script src="../../assets/js/teacher-layout.js"></script>
</head>
<body data-teacher-page="session-room" class="teacher-room">
    <div class="app-container">
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            
            <div class="app-content" style="padding-bottom: 0;">
                <div class="session-room">
                    <div class="session-header">
                        <div>
                            <h2 style="margin:0 0 0.25rem 0;" id="room-title">Loading Session...</h2>
                            <p style="margin:0; font-size:0.9rem; color:var(--text-muted);" id="room-subtitle"></p>
                        </div>
                        <div style="display:flex; gap:0.5rem;">
                            <button class="btn btn-secondary" onclick="markAbsent()">Student Absent</button>
                            <a href="sessions.html" class="btn btn-danger">Exit Room</a>
                        </div>
                    </div>
                    <div class="session-body">
                        <div class="session-main">
                            <div class="avatar-placeholder"><i class="ph ph-user"></i></div>
                            <h3 style="margin-bottom: 0.5rem;" id="student-name">...</h3>
                            <p style="color: var(--text-muted); margin-bottom: 2rem;" id="student-class">Student</p>
                            
                            <div class="timer" id="session-timer">29:59</div>
                            <p style="color: var(--text-muted);">Time Remaining</p>
                        </div>
                        <div class="session-sidebar">
                            <h4 style="margin-top:0; margin-bottom:1rem;">Session Info</h4>
                            <div style="background: var(--card-bg); padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 1.5rem; font-size: 0.9rem;">
                                <p style="margin:0 0 0.5rem 0;"><strong>Date:</strong> <span id="room-date"></span></p>
                                <p style="margin:0;"><strong>Time:</strong> <span id="room-time"></span></p>
                            </div>

                            <h4 style="margin-bottom:1rem;">Related Doubt</h4>
                            <div style="background: var(--card-bg); padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 1.5rem; font-size: 0.9rem;" id="room-doubt">
                                None linked.
                            </div>

                            <h4 style="margin-bottom:1rem;">Session Conclusion</h4>
                            <div class="form-group">
                                <label class="form-label">Session Notes (Internal & Student)</label>
                                <textarea id="session-notes" class="form-control" rows="4" placeholder="Enter discussion points..."></textarea>
                            </div>
                            
                            <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
                                <input type="checkbox" id="resolve-doubt-cb" style="width:16px; height:16px;">
                                <label for="resolve-doubt-cb" style="margin:0; font-size:0.9rem;">Mark Related Doubt as Resolved</label>
                            </div>

                            <button class="btn btn-primary w-100 mt-2" onclick="completeSession()">Mark Completed</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../assets/js/teacher-session-room.js"></script>
</body>
</html>

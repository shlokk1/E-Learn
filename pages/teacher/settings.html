<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Teacher Portal</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/forms.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../../assets/js/theme.js"></script>
    <script src="../../assets/js/teacher-core.js"></script>
    <script src="../../assets/js/teacher-layout.js"></script>
</head>
<body data-teacher-page="settings">
    <div class="app-container">
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            
            <div class="app-content">
                <div class="mb-4">
                    <h1>Settings</h1>
                    <p class="text-muted">Manage your preferences and notification settings.</p>
                </div>

                <div class="card" style="max-width: 600px;">
                    <form onsubmit="event.preventDefault(); TeacherCore.showToast('Settings saved successfully.', 'success');">
                        
                        <h3 class="card-title mb-4">Notification Preferences</h3>
                        <div class="form-group" style="display: flex; align-items: center; gap: 0.75rem;">
                            <input type="checkbox" id="notif-doubts" checked>
                            <label for="notif-doubts" style="color: var(--text-main); font-weight: 500;">Email me when a new doubt needs review</label>
                        </div>
                        <div class="form-group" style="display: flex; align-items: center; gap: 0.75rem;">
                            <input type="checkbox" id="notif-replies" checked>
                            <label for="notif-replies" style="color: var(--text-main); font-weight: 500;">Email me when a student replies to an ongoing doubt</label>
                        </div>
                        <div class="form-group" style="display: flex; align-items: center; gap: 0.75rem;">
                            <input type="checkbox" id="notif-flags">
                            <label for="notif-flags" style="color: var(--text-main); font-weight: 500;">Email me for new community flags</label>
                        </div>

                        <h3 class="card-title" style="margin-top: 2.5rem; margin-bottom: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">Security</h3>
                        <div class="form-group">
                            <label class="form-label">Current Password</label>
                            <input type="password" class="form-control" placeholder="••••••••">
                        </div>
                        <div class="form-group">
                            <label class="form-label">New Password</label>
                            <input type="password" class="form-control" placeholder="Leave blank to keep current">
                        </div>

                        <button type="submit" class="btn btn-primary mt-4">Save Settings</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Viewer - EduPortal</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/student.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../../assets/js/theme.js"></script>
    <script src="../../assets/js/mock-data.js"></script>
    <script src="../../assets/js/student.js"></script>
</head>
<body data-page="resource-viewer">
    <div class="app-container">
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            
            <div class="app-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <div>
                        <a href="library.html" class="btn btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.85rem; margin-bottom: 1rem;"><i class="ph ph-arrow-left"></i> Back to Library</a>
                        <h1 style="margin-bottom: 0.25rem;">Mathematics NCERT Part 1</h1>
                        <p class="text-muted">Mathematics &middot; Textbook</p>
                    </div>
                    <div>
                        <button class="btn btn-secondary"><i class="ph ph-download-simple"></i> Download PDF</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body" style="padding: 1rem;">
                        <div class="viewer-placeholder">
                            <div>
                                <i class="ph ph-file-pdf" style="font-size: 4rem; display: block; margin: 0 auto 1rem auto; text-align: center;"></i>
                                PDF VIEWER PLACEHOLDER
                            </div>
                        </div>
                        <div style="display: flex; justify-content: center; gap: 1rem; margin-top: 1rem;">
                            <button class="btn btn-secondary btn-icon"><i class="ph ph-minus"></i></button>
                            <span style="display: flex; align-items: center; font-weight: 500;">Page 1 / 150</span>
                            <button class="btn btn-secondary btn-icon"><i class="ph ph-plus"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>

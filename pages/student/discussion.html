<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Discussion - EduPortal</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/forms.css">
    <link rel="stylesheet" href="../../assets/css/student.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../../assets/js/theme.js"></script>
    <script src="../../assets/js/mock-data.js"></script>
    <script src="../../assets/js/student.js"></script>
</head>
<body data-page="discussion">
    <div class="app-container">
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            
            <div class="app-content">
                <div class="mb-4">
                    <a href="community.html" class="btn btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.85rem; margin-bottom: 1rem;"><i class="ph ph-arrow-left"></i> Back to Community</a>
                </div>

                <!-- Original Post -->
                <div class="card mb-4" id="discussionPostCard">
                    <div class="card-body">
                        <span class="badge badge-info mb-2" id="postBadge">Mathematics</span>
                        <h2 id="postTitle">How can I understand quadratic equations easily?</h2>
                        <p class="text-muted mt-2">Posted by <strong id="postAuthor">Rohan</strong> &middot; <span id="postTime">2 days ago</span></p>
                        <p class="mt-3" id="postContent">I'm struggling with the quadratic formula. Does anyone have a trick to memorize it or understand it better?</p>
                        
                        <div class="mt-4" style="border-top: 1px solid var(--border-color); padding-top: 1rem;">
                            <button id="postLikeBtn" class="btn btn-secondary" onclick="handleDiscussionLike()"><i class="ph ph-thumbs-up" id="postLikeIcon"></i> Helpful (<span id="postLikeCount">12</span>)</button>
                        </div>
                    </div>
                </div>

                <h4 id="repliesHeading">Replies (2)</h4>
                
                <div id="repliesContainer">
                    <!-- Replies rendered dynamically -->
                </div>

                <!-- Reply Box -->
                <div class="card">
                    <div class="card-body" style="padding: 1.25rem;">
                        <form id="replyForm" onsubmit="handlePostReply(event)">
                            <div class="form-group">
                                <label class="form-label">Your Reply</label>
                                <textarea id="replyContent" class="form-control" placeholder="Write your response..." style="min-height: 80px;" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary"><i class="ph ph-paper-plane-right"></i> Post Reply</button>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>
</body>
</html>

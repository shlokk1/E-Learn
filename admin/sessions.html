<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1:1 Session Monitoring - Admin Portal</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/admin-components.css">
    <link rel="stylesheet" href="../css/admin-tables.css">
    <link rel="stylesheet" href="../css/sessions.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/admin-layout.js"></script>
</head>
<body data-admin-page="sessions">
    <div class="app-container">
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            
            <div class="app-content">
                <div class="admin-header-flex">
                    <div>
                        <h1>1:1 Session Monitoring</h1>
                        <p class="text-muted">Platform-wide overview of doubt resolution sessions.</p>
                    </div>
                </div>

                <div class="admin-stats-grid mb-4">
                    <div class="stat-card">
                        <div class="stat-icon" style="background: rgba(37, 99, 235, 0.1); color: var(--primary-color);">
                            <i class="ph ph-video-camera"></i>
                        </div>
                        <div class="stat-value" id="stat-total">0</div>
                        <div class="stat-label">Total Sessions Created</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background: rgba(234, 179, 8, 0.1); color: var(--status-warning);">
                            <i class="ph ph-clock"></i>
                        </div>
                        <div class="stat-value" id="stat-upcoming">0</div>
                        <div class="stat-label">Upcoming / Booked</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background: rgba(34, 197, 94, 0.1); color: var(--status-success);">
                            <i class="ph ph-check-circle"></i>
                        </div>
                        <div class="stat-value" id="stat-completed">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background: rgba(168, 85, 247, 0.1); color: #a855f7;">
                            <i class="ph ph-users"></i>
                        </div>
                        <div class="stat-value" id="stat-available">0</div>
                        <div class="stat-label">Available Slots</div>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-header">
                        <h3 class="card-title">Filter Sessions</h3>
                    </div>
                    <div class="card-body" style="display:flex; gap:1rem;">
                        <input type="text" class="form-control" placeholder="Search Teacher or Student..." style="max-width: 250px;">
                        <select class="form-control" style="max-width: 200px;">
                            <option value="">All Statuses</option>
                            <option value="Available">Available</option>
                            <option value="Booked">Booked</option>
                            <option value="Completed">Completed</option>
                        </select>
                        <button class="btn btn-primary">Apply Filters</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">All Sessions Log</h3>
                    </div>
                    <div class="card-body" style="padding: 0;">
                        <table class="table" style="width: 100%;">
                            <thead>
                                <tr>
                                    <th>Teacher</th>
                                    <th>Student</th>
                                    <th>Subject & Class</th>
                                    <th>Date & Time</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="admin-table-body">
                                <!-- Populated via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div class="modal-content card" style="width:100%; max-width:400px; padding:2rem; position:relative;">
            <button onclick="closeDeleteModal()" style="position:absolute; top:1rem; right:1rem; background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--text-main);"><i class="ph ph-x"></i></button>
            <h2 style="margin-bottom: 1rem; color: var(--status-danger);">Delete Slot</h2>
            <p id="delete-modal-msg" style="margin-bottom: 1.5rem; line-height: 1.5;"></p>
            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger" onclick="confirmDelete()">Delete Slot</button>
            </div>
        </div>
    </div>
    <script src="../js/admin-sessions.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects - EduPortal Admin</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/admin-tables.css">
    <link rel="stylesheet" href="../css/admin-components.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/admin-core.js"></script>
    <script src="../js/admin-layout.js"></script>
</head>
<body data-admin-page="subjects">
    <div class="app-container">
        <aside class="app-sidebar admin-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            <div class="app-content">
                <div class="mb-4" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h1>Subject Management</h1>
                        <p class="text-muted">Manage academic subjects available across all classes.</p>
                    </div>
                    <button class="btn btn-primary"><i class="ph ph-plus"></i> Add Subject</button>
                </div>

                <div class="table-container">
                    <table class="admin-table">
                        <thead><tr><th>Subject Name</th><th>Code</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody>
                            <tr>
                                <td><strong>Mathematics</strong></td>
                                <td>MATH</td>
                                <td><span class="badge badge-success">Active</span></td>
                                <td><div class="table-actions"><button class="btn-icon"><i class="ph ph-pencil-simple"></i></button></div></td>
                            </tr>
                            <tr>
                                <td><strong>Science</strong></td>
                                <td>SCI</td>
                                <td><span class="badge badge-success">Active</span></td>
                                <td><div class="table-actions"><button class="btn-icon"><i class="ph ph-pencil-simple"></i></button></div></td>
                            </tr>
                            <tr>
                                <td><strong>English Literature</strong></td>
                                <td>ENG-LIT</td>
                                <td><span class="badge badge-danger">Inactive</span></td>
                                <td><div class="table-actions"><button class="btn-icon"><i class="ph ph-pencil-simple"></i></button></div></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>

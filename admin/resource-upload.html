<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resource - EduPortal</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/admin-components.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/admin-core.js"></script>
    <script src="../js/admin-layout.js"></script>
</head>
<body data-admin-page="library">
    <div class="app-container">
        <aside class="app-sidebar admin-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            <div class="app-content">
                <a href="library.html" class="btn btn-secondary mb-4" style="padding: 0.3rem 0.6rem; font-size: 0.85rem;"><i class="ph ph-arrow-left"></i> Back to Library</a>
                
                <h1 class="mb-4">Upload Educational Resource</h1>
                
                <div class="card" style="max-width: 800px;">
                    <div class="card-body">
                        <form onsubmit="event.preventDefault(); AdminCore.showToast('Resource uploaded successfully!', 'success'); setTimeout(()=>window.location.href='library.html', 1500);">
                            <div class="form-group">
                                <label class="form-label">Resource Title</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Description</label>
                                <textarea class="form-control" style="min-height: 100px;"></textarea>
                            </div>
                            
                            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;" class="mb-3">
                                <div class="form-group">
                                    <label class="form-label">Class</label>
                                    <select class="form-control" required><option>Class 9</option><option>Class 10</option></select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Subject</label>
                                    <select class="form-control" required><option>Mathematics</option><option>Science</option></select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Type</label>
                                    <select class="form-control" required><option>Textbook</option><option>PPT</option><option>Notes</option></select>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">File Upload (PDF, PPTX, etc.)</label>
                                <div style="border: 2px dashed var(--border-color); padding: 2rem; text-align: center; border-radius: var(--border-radius); background: var(--bg-color);">
                                    <i class="ph ph-upload-simple" style="font-size: 2rem; color: var(--text-muted); margin-bottom: 0.5rem;"></i>
                                    <p class="text-muted" style="margin-bottom: 1rem;">Drag and drop file here, or click to browse.</p>
                                    <input type="file" required>
                                </div>
                            </div>
                            
                            <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                                <a href="library.html" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary">Upload & Publish</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>

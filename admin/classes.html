<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes - EduPortal Admin</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/admin-components.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/admin-core.js"></script>
    <script src="../js/admin-layout.js"></script>
</head>
<body data-admin-page="classes">
    <div class="app-container">
        <aside class="app-sidebar admin-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            <div class="app-content">
                <div class="mb-4" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h1>Classes & Divisions</h1>
                        <p class="text-muted">Manage the academic structure of the institution.</p>
                    </div>
                    <button class="btn btn-primary"><i class="ph ph-plus"></i> Add Class</button>
                </div>

                <div class="grid-cards">
                    <div class="card">
                        <div class="card-header"><h3 class="card-title">Class 10</h3></div>
                        <div class="card-body">
                            <ul style="list-style: none; padding: 0; margin-bottom: 1rem;">
                                <li style="padding: 0.5rem 0; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between;"><span>Division A</span> <span class="text-muted">42 Students</span></li>
                                <li style="padding: 0.5rem 0; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between;"><span>Division B</span> <span class="text-muted">38 Students</span></li>
                                <li style="padding: 0.5rem 0; display: flex; justify-content: space-between;"><span>Division C</span> <span class="text-muted">40 Students</span></li>
                            </ul>
                            <button class="btn btn-secondary" style="width: 100%;"><i class="ph ph-plus"></i> Add Division</button>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header"><h3 class="card-title">Class 9</h3></div>
                        <div class="card-body">
                            <ul style="list-style: none; padding: 0; margin-bottom: 1rem;">
                                <li style="padding: 0.5rem 0; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between;"><span>Division A</span> <span class="text-muted">45 Students</span></li>
                                <li style="padding: 0.5rem 0; display: flex; justify-content: space-between;"><span>Division B</span> <span class="text-muted">42 Students</span></li>
                            </ul>
                            <button class="btn btn-secondary" style="width: 100%;"><i class="ph ph-plus"></i> Add Division</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Library Management - Admin</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/admin-tables.css">
    <link rel="stylesheet" href="../css/admin-components.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/admin-core.js"></script>
    <script src="../js/admin-layout.js"></script>
</head>
<body data-admin-page="library">
    <div class="app-container">
        <aside class="app-sidebar admin-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            <div class="app-content">
                <div class="mb-4" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h1>Digital Library</h1>
                        <p class="text-muted">Manage all educational resources across classes.</p>
                    </div>
                    <a href="resource-upload.html" class="btn btn-primary"><i class="ph ph-upload-simple"></i> Upload Resource</a>
                </div>

                <div class="table-container">
                    <div class="table-header-bar">
                        <div class="form-group" style="margin: 0;"><input type="text" class="form-control" placeholder="Search resources..."></div>
                        <div class="table-filters">
                            <select class="form-control"><option>Class 10</option></select>
                            <select class="form-control"><option>All Types</option><option>Textbook</option><option>PPT</option></select>
                            <button class="btn btn-secondary"><i class="ph ph-funnel"></i> Filter</button>
                        </div>
                    </div>
                    
                    <table class="admin-table">
                        <thead><tr><th>Title</th><th>Type</th><th>Class</th><th>Subject</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody>
                            <tr>
                                <td><strong>Mathematics NCERT</strong></td>
                                <td>Textbook</td><td>10</td><td>Mathematics</td>
                                <td><span class="badge badge-success">Active</span></td>
                                <td><div class="table-actions">
                                    <button class="btn-icon"><i class="ph ph-pencil-simple"></i></button>
                                    <button class="btn-icon" style="color:var(--status-warning);" title="Archive"><i class="ph ph-archive"></i></button>
                                </div></td>
                            </tr>
                            <tr>
                                <td><strong>Chemical Reactions</strong></td>
                                <td>PPT</td><td>10</td><td>Science</td>
                                <td><span class="badge badge-success">Active</span></td>
                                <td><div class="table-actions">
                                    <button class="btn-icon"><i class="ph ph-pencil-simple"></i></button>
                                    <button class="btn-icon" style="color:var(--status-warning);"><i class="ph ph-archive"></i></button>
                                </div></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements - EduPortal Admin</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/admin-tables.css">
    <link rel="stylesheet" href="../css/admin-components.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/admin-core.js"></script>
    <script src="../js/admin-layout.js"></script>
</head>
<body data-admin-page="announcements">
    <div class="app-container">
        <aside class="app-sidebar admin-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            <div class="app-content">
                <div class="mb-4" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h1>Announcements</h1>
                        <p class="text-muted">Manage global and class-specific notices.</p>
                    </div>
                    <a href="create-announcement.html" class="btn btn-primary"><i class="ph ph-plus"></i> Create Notice</a>
                </div>

                <div class="table-container">
                    <table class="admin-table">
                        <thead><tr><th>Title</th><th>Audience</th><th>Date Published</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody>
                            <tr>
                                <td><strong>Math Unit Test Schedule</strong></td>
                                <td>Class 10</td><td>Aug 18, 2026</td>
                                <td><span class="badge badge-success">Published</span></td>
                                <td><div class="table-actions"><button class="btn-icon"><i class="ph ph-pencil-simple"></i></button><button class="btn-icon" style="color:var(--status-danger)"><i class="ph ph-trash"></i></button></div></td>
                            </tr>
                            <tr>
                                <td><strong>Holiday Notice - Diwali</strong></td>
                                <td>All Students</td><td>Aug 15, 2026</td>
                                <td><span class="badge badge-success">Published</span></td>
                                <td><div class="table-actions"><button class="btn-icon"><i class="ph ph-pencil-simple"></i></button><button class="btn-icon" style="color:var(--status-danger)"><i class="ph ph-trash"></i></button></div></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>

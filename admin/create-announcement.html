<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Announcement - EduPortal Admin</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/admin-components.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/admin-core.js"></script>
    <script src="../js/admin-layout.js"></script>
</head>
<body data-admin-page="announcements">
    <div class="app-container">
        <aside class="app-sidebar admin-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            <div class="app-content">
                <a href="announcements.html" class="btn btn-secondary mb-4" style="padding: 0.3rem 0.6rem; font-size: 0.85rem;"><i class="ph ph-arrow-left"></i> Back</a>
                
                <h1 class="mb-4">Create Announcement</h1>
                
                <div class="card" style="max-width: 800px;">
                    <div class="card-body">
                        <form onsubmit="event.preventDefault(); AdminCore.showToast('Announcement Published!', 'success'); setTimeout(()=>window.location.href='announcements.html', 1500);">
                            <div class="form-group">
                                <label class="form-label">Notice Title</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Message Content</label>
                                <textarea class="form-control" style="min-height: 150px;" required></textarea>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Target Audience</label>
                                <select class="form-control">
                                    <option>All Students & Teachers</option>
                                    <option>Class 9 Only</option>
                                    <option>Class 10 Only</option>
                                    <option>Teachers Only</option>
                                </select>
                            </div>
                            
                            <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                                <button type="button" class="btn btn-secondary">Save as Draft</button>
                                <button type="submit" class="btn btn-primary">Publish Now</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>

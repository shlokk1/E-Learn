<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up - EduPortal</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/auth.css">

    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- JS -->
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
</head>
<body>

    <div class="auth-page" style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: var(--bg-color);">
        <!-- Theme Toggle -->
        <div class="auth-theme-toggle">
            <button class="btn-icon theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
                <i class="ph ph-moon"></i>
            </button>
        </div>

        <div class="slider-container" id="slider-container">
            <div class="form-container sign-up-container">
                <form id="registerForm">
                    <h1>Create Account</h1>
                    <div class="social-container">
                        <a href="#" class="social"><i class="ph ph-google-logo"></i></a>
                        <a href="#" class="social"><i class="ph ph-facebook-logo"></i></a>
                        <a href="#" class="social"><i class="ph ph-github-logo"></i></a>
                        <a href="#" class="social"><i class="ph ph-linkedin-logo"></i></a>
                    </div>
                    <span>or use your email for registration</span>
                    <input type="text" id="regName" class="form-control" placeholder="Name" required />
                    <input type="email" id="regEmail" class="form-control" placeholder="Email" required />
                    <input type="password" id="regPassword" class="form-control" placeholder="Password" required />
                    <select id="regRole" class="form-control" style="margin-bottom: 15px;" required>
                        <option value="student">Student</option>
                        <option value="mentor">Teacher / Mentor</option>
                        <option value="admin">Administrator</option>
                    </select>
                    <!-- Hidden fields for compatibility with auth.js -->
                    <input type="hidden" id="regClass" value="10">
                    <input type="hidden" id="regDiv" value="A">
                    
                    <button type="submit">Sign Up</button>
                </form>
            </div>
            
            <div class="form-container sign-in-container">
                <form id="loginForm">
                    <h1>Sign In</h1>
                    <div class="social-container">
                        <a href="#" class="social"><i class="ph ph-google-logo"></i></a>
                        <a href="#" class="social"><i class="ph ph-facebook-logo"></i></a>
                        <a href="#" class="social"><i class="ph ph-github-logo"></i></a>
                        <a href="#" class="social"><i class="ph ph-linkedin-logo"></i></a>
                    </div>
                    <span>or use your email password</span>
                    <input type="email" id="email" class="form-control" placeholder="Email" required />
                    <input type="password" id="password" class="form-control" placeholder="Password" required />
                    <select id="role" class="form-control" style="margin-bottom: 10px;" required>
                        <option value="student">Student</option>
                        <option value="mentor">Teacher / Mentor</option>
                        <option value="admin">Administrator</option>
                    </select>
                    <a href="#">Forget Your Password?</a>
                    <button type="submit">Sign In</button>
                </form>
            </div>
            
            <div class="overlay-container">
                <div class="overlay">
                    <div class="overlay-panel overlay-left">
                        <h1>Welcome Back!</h1>
                        <p>To keep connected with us please login with your personal info</p>
                        <button class="ghost" id="signIn">Sign In</button>
                    </div>
                    <div class="overlay-panel overlay-right">
                        <h1>Hello, Friend!</h1>
                        <p>Register with your personal details to use all of site features</p>
                        <button class="ghost" id="signUp">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const signUpButton = document.getElementById('signUp');
        const signInButton = document.getElementById('signIn');
        const container = document.getElementById('slider-container');

        signUpButton.addEventListener('click', () => {
            container.classList.add("right-panel-active");
        });

        signInButton.addEventListener('click', () => {
            container.classList.remove("right-panel-active");
        });
    </script>
</body>
</html>

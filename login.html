<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduPortal</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/auth.css">

    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- JS -->
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
</head>
<body>

    <div class="auth-page">
        <!-- Theme Toggle -->
        <div class="auth-theme-toggle">
            <button class="btn-icon theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
                <i class="ph ph-moon"></i>
            </button>
        </div>

        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-brand">
                    <i class="ph ph-book-open"></i>
                    <span>EduPortal</span>
                </a>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Log in to access your educational resources.</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="role">Login As</label>
                    <select id="role" class="form-control" required>
                        <option value="student">Student</option>
                        <option value="mentor">Teacher / Mentor</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="student@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-password" style="margin-bottom: 0;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Sign Up</a>
            </div>
        </div>
    </div>

</body>
</html>

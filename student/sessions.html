<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1:1 Sessions - EduPortal</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/student.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/sessions.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/student.js"></script>
</head>
<body data-page="sessions">
    <div class="app-container">
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            
            <div class="app-content">
                <h1 style="margin-bottom: 2rem;">1:1 Doubt Resolution Sessions</h1>
                
                <div class="session-grid">
                    <!-- Left: Available & Upcoming -->
                    <div>
                        <div class="card mb-4">
                            <div class="card-header">
                                <h3 class="card-title">Upcoming 1:1 Sessions</h3>
                            </div>
                            <div class="card-body" id="upcoming-sessions-container">
                                <!-- Populated via JS -->
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Available Teacher Slots</h3>
                            </div>
                            <div class="card-body" id="available-slots-container">
                                <!-- Populated via JS -->
                            </div>
                        </div>
                    </div>

                    <!-- Right: History -->
                    <div>
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Session History</h3>
                            </div>
                            <div class="card-body" id="history-container">
                                <!-- Populated via JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Booking Modal -->
    <div id="booking-modal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div class="modal-content card" style="width:100%; max-width:500px; padding:2rem; position:relative;">
            <button onclick="closeModal()" style="position:absolute; top:1rem; right:1rem; background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--text-main);"><i class="ph ph-x"></i></button>
            <h2 style="margin-bottom: 1.5rem;">Book 1:1 Doubt Session</h2>
            
            <div id="modal-slot-details" style="margin-bottom: 1.5rem; background: var(--bg-color); padding: 1rem; border-radius: 8px;">
                <!-- Filled via JS -->
            </div>

            <div class="form-group mb-4">
                <label for="related-doubt" class="form-label">Select Related Doubt</label>
                <select id="related-doubt" class="form-control">
                    <option value="">New discussion topic</option>
                    <!-- Filled via JS -->
                </select>
            </div>

            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="confirmBooking()">Confirm Booking</button>
            </div>
        </div>
    </div>
    <script src="../js/student-sessions.js"></script>
</body>
</html>

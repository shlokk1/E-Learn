<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1:1 Session - EduPortal</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/student.css">
    <link rel="stylesheet" href="../css/sessions.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/student.js"></script>
</head>
<body data-page="session-room" class="student-room">
    <div class="app-container">
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            
            <div class="app-content" style="padding-bottom: 0;">
                <div class="session-room">
                    <div class="session-header">
                        <div>
                            <h2 style="margin:0 0 0.25rem 0;" id="room-title">Loading Session...</h2>
                            <p style="margin:0; font-size:0.9rem; color:var(--text-muted);" id="room-subtitle"></p>
                        </div>
                        <a href="sessions.html" class="btn btn-danger" onclick="leaveSession()">Leave Session</a>
                    </div>
                    <div class="session-body">
                        <div class="session-main">
                            <div class="avatar-placeholder"><i class="ph ph-chalkboard-teacher"></i></div>
                            <h3 style="margin-bottom: 0.5rem;" id="teacher-name">...</h3>
                            <p style="color: var(--text-muted); margin-bottom: 2rem;">Teacher</p>
                            
                            <div class="timer" id="session-timer">29:59</div>
                            <p style="color: var(--text-muted);">Time Remaining</p>
                        </div>
                        <div class="session-sidebar">
                            <h4 style="margin-top:0; margin-bottom:1rem;">Session Details</h4>
                            <div style="background: var(--card-bg); padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 1rem; font-size: 0.9rem;">
                                <p style="margin:0 0 0.5rem 0;"><strong>Subject:</strong> <span id="room-subject"></span></p>
                                <p style="margin:0 0 0.5rem 0;"><strong>Date:</strong> <span id="room-date"></span></p>
                                <p style="margin:0;"><strong>Time:</strong> <span id="room-time"></span></p>
                            </div>

                            <h4 style="margin-bottom:1rem;">Related Doubt</h4>
                            <div style="background: var(--card-bg); padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); flex: 1; overflow-y: auto; font-size: 0.9rem;" id="room-doubt">
                                None linked.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/student-session-room.js"></script>
</body>
</html>

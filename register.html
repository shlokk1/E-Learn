<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - EduPortal</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/auth.css">

    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- JS -->
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
</head>
<body>

    <div class="auth-page">
        <!-- Theme Toggle -->
        <div class="auth-theme-toggle">
            <button class="btn-icon theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
                <i class="ph ph-moon"></i>
            </button>
        </div>

        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-brand">
                    <i class="ph ph-book-open"></i>
                    <span>EduPortal</span>
                </a>
                <h1 class="auth-title">Create an Account</h1>
                <p class="auth-subtitle">Join the portal to start learning and asking doubts.</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="regRole">Sign Up As</label>
                    <select id="regRole" class="form-control" required>
                        <option value="student">Student</option>
                        <option value="mentor">Teacher / Mentor</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regName">Full Name</label>
                    <input type="text" id="regName" class="form-control" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="student@example.com" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="regClass">Class</label>
                        <select id="regClass" class="form-control" required>
                            <option value="">Select Class</option>
                            <option value="8">Class 8</option>
                            <option value="9">Class 9</option>
                            <option value="10" selected>Class 10</option>
                            <option value="11">Class 11</option>
                            <option value="12">Class 12</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="regDiv">Division</label>
                        <select id="regDiv" class="form-control" required>
                            <option value="">Select Division</option>
                            <option value="A" selected>A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regPassword">Password</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
                </div>

                <!-- Note for prototype context -->
                <p class="text-muted mb-3" style="font-size: 0.8rem; text-align: center;">
                    *Registration currently provisions a Student role automatically for this prototype.
                </p>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </div>
    </div>

</body>
</html>

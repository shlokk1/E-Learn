<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Answer Doubt - Teacher Portal</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/admin-components.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/teacher-core.js"></script>
    <script src="../js/teacher-layout.js"></script>
</head>
<body data-teacher-page="my-doubts">
    <div class="app-container">
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            
            <div class="app-content" style="display: flex; flex-direction: column; max-height: calc(100vh - 6rem);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <div>
                        <a href="my-doubts.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.85rem;"><i class="ph ph-arrow-left"></i> Back to My Doubts</a>
                        <h1 style="font-size: 1.25rem; margin-top: 0.25rem; margin-bottom: 0;">2x + 5 = 15 Equation</h1>
                    </div>
                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <span class="badge badge-info" style="margin-right: 0.5rem;">Approved</span>
                        <button class="btn btn-secondary" onclick="TeacherCore.showToast('Thread marked as resolved!', 'success');"><i class="ph ph-check-circle"></i> Mark as Resolved</button>
                    </div>
                </div>

                <!-- Chat/Discussion Area -->
                <div class="card" style="flex: 1; display: flex; flex-direction: column; padding: 0; overflow: hidden;">
                    
                    <!-- Scrollable History -->
                    <div style="flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; background-color: var(--bg-color);">
                        
                        <!-- Original Question (Student) -->
                        <div style="display: flex; gap: 1rem;">
                            <div style="width: 40px; height: 40px; border-radius: 50%; background: #94a3b8; color: white; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                                S
                            </div>
                            <div style="background: var(--surface-color); padding: 1rem; border-radius: 0 var(--border-radius-lg) var(--border-radius-lg) var(--border-radius-lg); border: 1px solid var(--border-color); max-width: 80%;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                                    <strong style="color: var(--text-main);">Student A</strong>
                                    <span class="text-muted" style="font-size: 0.75rem;">10:30 AM</span>
                                </div>
                                <p style="margin: 0; color: var(--text-main); line-height: 1.5;">"I don't understand how to isolate x in the equation 2x + 5 = 15. Why do we subtract 5 first instead of dividing by 2?"</p>
                                <div style="margin-top: 0.75rem; display: inline-flex; align-items: center; gap: 0.5rem; background: var(--bg-color); padding: 0.4rem 0.75rem; border-radius: var(--border-radius-sm); border: 1px solid var(--border-color); font-size: 0.85rem;">
                                    <i class="ph ph-image" style="color: var(--primary-color);"></i> equation_homework.jpg
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- Input Area -->
                    <div style="border-top: 1px solid var(--border-color); padding: 1rem 1.5rem; background: var(--surface-color);">
                        <form onsubmit="event.preventDefault(); TeacherCore.showToast('Response sent to student.', 'success'); this.reset();" style="display: flex; gap: 1rem; align-items: flex-end;">
                            <div style="flex: 1;">
                                <label class="form-label sr-only">Your Answer</label>
                                <textarea class="form-control" placeholder="Type your academic response here..." style="min-height: 80px; margin-bottom: 0;" required></textarea>
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                                <button type="button" class="btn btn-secondary" title="Attach Resource" style="padding: 0.5rem;"><i class="ph ph-paperclip"></i></button>
                                <button type="submit" class="btn btn-primary" style="padding: 0.5rem 1.5rem;"><i class="ph ph-paper-plane-tilt"></i> Send</button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </main>
    </div>
</body>
</html>

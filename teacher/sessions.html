<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1:1 Sessions Management - Teacher Portal</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/admin-components.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/sessions.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/teacher-layout.js"></script>
</head>
<body data-teacher-page="sessions">
    <div class="app-container">
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            
            <div class="app-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h1>1:1 Sessions Management</h1>
                    <button class="btn btn-primary" onclick="openAvailabilityModal()"><i class="ph ph-plus"></i> Add Availability</button>
                </div>

                <div class="grid-3 mb-4">
                    <div class="card" style="grid-column: span 2;">
                        <div class="card-header">
                            <h3 class="card-title">Upcoming Sessions</h3>
                        </div>
                        <div class="card-body" id="teacher-upcoming-container">
                            <!-- Populated via JS -->
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">My Slots</h3>
                        </div>
                        <div class="card-body" id="teacher-slots-container">
                            <!-- Populated via JS -->
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Session History</h3>
                    </div>
                    <div class="card-body">
                        <table class="table w-100">
                            <thead>
                                <tr>
                                    <th>Date & Time</th>
                                    <th>Student</th>
                                    <th>Subject</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="teacher-history-tbody">
                                <!-- Populated via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Availability Modal -->
    <div id="availability-modal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div class="modal-content card" style="width:100%; max-width:500px; padding:2rem; position:relative;">
            <button onclick="closeAvailabilityModal()" style="position:absolute; top:1rem; right:1rem; background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--text-main);"><i class="ph ph-x"></i></button>
            <h2 style="margin-bottom: 1.5rem;">Add Availability</h2>
            
            <div class="form-group">
                <label class="form-label">Date</label>
                <input type="date" id="avail-date" class="form-control" value="2026-10-03">
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label">Start Time</label>
                    <input type="time" id="avail-start" class="form-control" value="10:00">
                </div>
                <div class="form-group">
                    <label class="form-label">End Time</label>
                    <input type="time" id="avail-end" class="form-control" value="12:00">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Session Duration</label>
                <select id="avail-duration" class="form-control">
                    <option value="30">30 minutes</option>
                    <option value="60">60 minutes</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Subject</label>
                <input type="text" id="avail-subject" class="form-control" value="Mathematics">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
                <div class="form-group mb-0">
                    <label class="form-label">Class</label>
                    <input type="text" id="avail-class" class="form-control" value="10">
                </div>
                <div class="form-group mb-0">
                    <label class="form-label">Division</label>
                    <input type="text" id="avail-division" class="form-control" value="A">
                </div>
            </div>

            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="closeAvailabilityModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveAvailability()">Generate Slots</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div class="modal-content card" style="width:100%; max-width:400px; padding:2rem; position:relative;">
            <button onclick="closeDeleteModal()" style="position:absolute; top:1rem; right:1rem; background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--text-main);"><i class="ph ph-x"></i></button>
            <h2 style="margin-bottom: 1rem; color: var(--status-danger);">Delete Slot</h2>
            <p id="delete-modal-msg" style="margin-bottom: 1.5rem; line-height: 1.5;"></p>
            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger" onclick="confirmDelete()">Delete Slot</button>
            </div>
        </div>
    </div>
    <script src="../js/teacher-sessions.js"></script>
</body>
</html>

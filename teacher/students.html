<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - Teacher Portal</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/admin-tables.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/teacher-core.js"></script>
    <script src="../js/teacher-layout.js"></script>
</head>
<body data-teacher-page="students">
    <div class="app-container">
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>
            
            <div class="app-content">
                <div class="mb-4">
                    <h1>My Students</h1>
                    <p class="text-muted">View students in your assigned classes and divisions.</p>
                </div>

                <div class="card mb-4" style="padding: 1rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 200px;">
                        <input type="text" class="form-control" placeholder="Search students by name...">
                    </div>
                    <select class="form-control" style="width: auto;">
                        <option>Class 10 - Division A</option>
                        <option>Class 10 - Division B</option>
                    </select>
                </div>

                <div class="table-container card" style="padding: 0;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Student Name</th>
                                <th>Doubts Asked</th>
                                <th>Resolved</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><div style="font-weight: 500;">Student A</div><div class="text-muted" style="font-size: 0.8rem;">student.a@example.com</div></td>
                                <td>8</td>
                                <td>7</td>
                                <td><span class="badge badge-success">Active</span></td>
                                <td><a href="student-details.html" class="btn btn-secondary" style="padding: 0.3rem 0.75rem; font-size: 0.85rem;">View Profile</a></td>
                            </tr>
                            <tr>
                                <td><div style="font-weight: 500;">Student B</div><div class="text-muted" style="font-size: 0.8rem;">student.b@example.com</div></td>
                                <td>5</td>
                                <td>5</td>
                                <td><span class="badge badge-success">Active</span></td>
                                <td><a href="student-details.html" class="btn btn-secondary" style="padding: 0.3rem 0.75rem; font-size: 0.85rem;">View Profile</a></td>
                            </tr>
                            <tr>
                                <td><div style="font-weight: 500;">Student C</div><div class="text-muted" style="font-size: 0.8rem;">student.c@example.com</div></td>
                                <td>3</td>
                                <td>1</td>
                                <td><span class="badge badge-success">Active</span></td>
                                <td><a href="student-details.html" class="btn btn-secondary" style="padding: 0.3rem 0.75rem; font-size: 0.85rem;">View Profile</a></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
